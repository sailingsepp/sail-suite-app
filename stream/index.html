<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Törn live · Sail-Suite</title>
<meta name="author" content="Sepp">
<meta name="description" content="Einen Törn von zu Hause aus mitverfolgen: Karte, aktuelle Position, Logbuch und Fotos. Über Sail-Suite geteilt, nur lesen.">
<meta name="application-name" content="Sail-Suite">

<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1E2D">
<link rel="icon" href="/icon-voyagebook-180.png">
</head>
<body class="stream">

<main class="st" id="st">
  <header class="st-kopf">
    <div>
      <p class="st-oberzeile" data-st="titel">Törn live</p>
      <h1 id="st-name"></h1>
      <p class="st-status" id="st-status" hidden></p>
      <p class="st-unter" id="st-geteilt"></p>
    </div>
    
    <div class="st-kopf-knoepfe">
      <button type="button" class="st-knopf" id="st-kommentieren" hidden>Kommentieren (0)</button>
      <button type="button" class="st-knopf" id="st-neu">Neu laden</button>
    </div>
    
    <dl class="st-kopf-daten" id="st-kopf-daten"></dl>
  </header>
  <p class="st-meldung" id="st-meldung" role="status" aria-live="polite"></p>

  <div id="st-inhalt" hidden>
    <p class="st-hinweis" id="st-keine" hidden data-st="keineAufzeichnung"></p>

    <section id="st-karte-bereich" hidden aria-labelledby="st-karte-titel">
      <h2 class="st-unsichtbar" id="st-karte-titel" data-st="karte">Karte</h2>
      
      <section class="st-kachel st-wetter-kachel" id="st-wetter" hidden aria-live="polite"></section>
      <div class="st-instrumente" id="st-instrumente" hidden></div>
      <div class="st-karte" id="st-karte"></div>
      
      <p class="st-meilen" id="st-meilen" hidden></p>

      <section class="st-kachel" id="st-aktuell" hidden aria-labelledby="st-aktuell-titel">
        <div class="st-kachel-kopf">
          <h2 id="st-aktuell-titel" data-st="aktuell">Aktuell</h2>
          <span class="st-zustand" id="st-zustand"></span>
        </div>
        <p class="st-unter" id="st-stand"></p>
        <p class="st-warnung" id="st-veraltet" hidden></p>
        <dl class="st-werte" id="st-werte"></dl>
        
        <details class="st-heute" id="st-heute" open>
          <summary id="st-heute-titel"></summary>
          
          <p class="st-zone" id="st-heute-zone"></p>
          <div id="st-heute-log"></div>
        </details>
      </section>

      <section class="st-kachel" id="st-tage-bereich" hidden aria-labelledby="st-tage-titel">
        <h2 id="st-tage-titel" data-st="fahrtage">Fahrtage</h2>
        <div id="st-tage" class="st-tage"></div>
      </section>
    </section>

    <section class="st-kachel" id="st-fotos-bereich" hidden aria-labelledby="st-fotos-titel">
      <h2 id="st-fotos-titel" data-st="fotos">Fotos der Crew</h2>
      <div id="st-fotos-uebrig"></div>
    </section>

    
    <section class="st-kachel" aria-labelledby="st-toern-titel">
      <h2 id="st-toern-titel" data-st="yacht">Yacht</h2>
      <img class="st-schiff-foto" id="st-schiff-foto" alt="" hidden>
      <dl class="st-werte" id="st-toern-daten"></dl>
    </section>

    <section class="st-kachel" id="st-crew-bereich" aria-labelledby="st-crew-titel">
      <h2 id="st-crew-titel" data-st="crew">Crew</h2>
      <ul class="st-crew" id="st-crew"></ul>
    </section>

    
    <section class="st-kachel" id="st-kommentare-bereich" hidden aria-labelledby="st-kommentare-titel">
      <h2 id="st-kommentare-titel" data-st="kommentare">Kommentare</h2>
      
      <button type="button" class="st-knopf st-knopf-haupt" id="st-kommentar-neu" data-st="kommentieren">Kommentieren</button>
      <div id="st-kommentare" aria-live="polite"></div>
      
      <p class="st-unter st-anmelden" id="st-kommentar-anmelden-zeile" hidden><a id="st-kommentar-anmelden" data-st="kommentar.anmelden" href="/">Als Crew anmelden</a></p>
    </section>

  </div>
  
  <p class="st-unter st-recht"><a href="/#impressum" data-st="impressum">Impressum</a> · <a href="/#datenschutz" data-st="datenschutz">Datenschutzerklärung</a></p>
</main>
<dialog class="st-dialog" id="st-kommentar-dialog" aria-labelledby="st-kommentar-titel">
  <form id="st-kommentar-form" novalidate>
    <h2 id="st-kommentar-titel" data-st="kommentieren">Kommentieren</h2>
    <label class="st-feld"><span data-st="kommentar.name">Name</span>
      <input type="text" id="st-kommentar-name" name="name" autocomplete="name" required></label>
    <label class="st-feld"><span data-st="kommentar.text">Kommentar</span>
      <textarea id="st-kommentar-text" name="text" rows="5" required></textarea></label>
    <p class="st-unter" data-st="kommentar.hinweis"></p>
    <p class="st-warnung" id="st-kommentar-meldung" role="alert"></p>
    <div class="st-dialog-knoepfe">
      <button type="button" class="st-knopf" id="st-kommentar-abbrechen" data-st="abbrechen">Abbrechen</button>
      <button type="submit" class="st-knopf st-knopf-haupt" id="st-kommentar-senden" data-st="senden">Senden</button>
    </div>
  </form>
</dialog>
<script type="module" src="/src/apps/stream/main.ts"></script>
</body>
</html>
