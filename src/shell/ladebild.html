
<style>
  #ladebild{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:26px;background:#0B1E2D;color:#DCE6EA;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition:opacity .25s ease}
  #ladebild.lb-weg{opacity:0;pointer-events:none}
  #ladebild.lb-aus{display:none}
  #ladebild .lb-kopf{display:flex;align-items:center;gap:12px}
  #ladebild .lb-logo{width:44px;height:44px}
  #ladebild .lb-name{font-size:26px;font-weight:700;letter-spacing:.02em}
  #ladebild .lb-logo-ring{fill:none;stroke:#F2A93B}
  #ladebild .lb-logo-nadel{fill:#2DA8A0}
  #ladebild .lb-logo-punkt{fill:#F2A93B}
  #ladebild .lb-anzeige{position:relative;width:150px;height:150px}
  
  #ladebild .lb-dreh{position:absolute;inset:0;transform:rotate(-90deg);will-change:transform}
  #ladebild .lb-ring{display:block;width:100%;height:100%}
  #ladebild .lb-ring-spur,#ladebild .lb-ring-bogen{fill:none;stroke-width:7;stroke-linecap:round}
  #ladebild .lb-ring-spur{stroke:rgba(122,168,184,.22)}
  #ladebild .lb-ring-bogen{stroke:#2DA8A0;stroke-dasharray:66 197.9}
  
  #ladebild .lb-boot{position:absolute;top:50%;left:50%;width:90px;height:90px;
    transform:translate(-50%,-50%);transform-origin:50% 71%;will-change:transform}
  #ladebild .lb-boot-bild{display:block;width:100%;height:100%}
  #ladebild .lb-boot-rumpf{fill:#F2A93B}
  #ladebild .lb-boot-mast{stroke:#2DA8A0;stroke-width:2;stroke-linecap:round}
  #ladebild .lb-boot-gross{fill:#2DA8A0}
  #ladebild .lb-boot-fock{fill:#2DA8A0;opacity:.65}
  @media (prefers-reduced-motion:no-preference){
    #ladebild .lb-dreh{animation:lb-ring-dreh 1.3s linear infinite}
    #ladebild .lb-boot{animation:lb-boot-wiegen 2.6s ease-in-out infinite}
  }
  
  @media (prefers-reduced-motion:reduce){
    #ladebild .lb-dreh{animation:lb-puls 1.6s ease-in-out infinite}
  }
  @keyframes lb-puls{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes lb-ring-dreh{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
  @keyframes lb-boot-wiegen{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-50%) rotate(4deg)}}
  
  html[data-ladebild="nacht"] #ladebild{background:#060000;color:#e2503f}
  html[data-ladebild="nacht"] #ladebild .lb-logo-ring{stroke:#ffb09a}
  html[data-ladebild="nacht"] #ladebild .lb-logo-punkt,html[data-ladebild="nacht"] #ladebild .lb-boot-rumpf{fill:#ffb09a}
  html[data-ladebild="nacht"] #ladebild .lb-logo-nadel,html[data-ladebild="nacht"] #ladebild .lb-boot-gross,
  html[data-ladebild="nacht"] #ladebild .lb-boot-fock{fill:#ff9478}
  html[data-ladebild="nacht"] #ladebild .lb-boot-mast,html[data-ladebild="nacht"] #ladebild .lb-ring-bogen{stroke:#ff9478}
  html[data-ladebild="nacht"] #ladebild .lb-ring-spur{stroke:rgba(255,70,50,.28)}
</style>
<div id="ladebild" role="status" aria-label="Sail-Suite">
  <div class="lb-kopf" aria-hidden="true">
    <svg class="lb-logo" viewBox="0 0 32 32">
      <circle class="lb-logo-ring" cx="16" cy="16" r="14" stroke-width="1.6"/>
      <path class="lb-logo-nadel" d="M16 4 L19 16 L16 28 L13 16 Z"/>
      <circle class="lb-logo-punkt" cx="16" cy="16" r="1.6"/>
    </svg>
    <span class="lb-name">Sail-Suite</span>
  </div>
  <div class="lb-anzeige" aria-hidden="true">
    <div class="lb-dreh"><svg class="lb-ring" viewBox="0 0 96 96">
      <circle class="lb-ring-spur" cx="48" cy="48" r="42"/>
      <circle class="lb-ring-bogen" cx="48" cy="48" r="42"/>
    </svg></div>
    <div class="lb-boot"><svg class="lb-boot-bild" viewBox="0 0 48 48">
      <path class="lb-boot-rumpf" d="M6 34 Q24 40.5 42 34 L37.5 29.5 Q24 32.5 10.5 29.5 Z"/>
      <line class="lb-boot-mast" x1="24" y1="30" x2="24" y2="6"/>
      <path class="lb-boot-gross" d="M24.5 8 L24.5 28 L40 29 Z"/>
      <path class="lb-boot-fock" d="M23.5 15 L23.5 28 L11 27 Z"/>
    </svg></div>
  </div>
</div>
<script>
  (function () {
    var l = document.getElementById('ladebild');
    var zeit = 0;
    try { if (localStorage.getItem('sail-suite:theme') === 'nacht') document.documentElement.setAttribute('data-ladebild', 'nacht'); } catch (e) {  }
    function aus() {
      clearTimeout(zeit);
      l.classList.add('lb-weg');
      setTimeout(function () { if (l.classList.contains('lb-weg')) l.classList.add('lb-aus'); }, 300);
    }
    function an() {
      clearTimeout(zeit);
      l.classList.remove('lb-aus', 'lb-weg');
      zeit = setTimeout(aus, 20000);
    }
    zeit = setTimeout(aus, 20000);
    
    
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
      var u = new URL(a.href, location.href);
      if (u.origin !== location.origin || u.pathname === location.pathname) return;
      if (!/^\/((coursecast|trackbook|voyagebook|voyageplan)\/(index\.html)?)?$/.test(u.pathname)) return;
      an();
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted) { clearTimeout(zeit); l.classList.add('lb-weg', 'lb-aus'); } });
  })();
</script>
